# =============================================================================
# Anatomical labelling of sEEG channels: subject -> region -> channel names
# =============================================================================
# Keys of the top level must match the IDs in `subjects` (config.yaml).
# Channel names may be bipolar ("HC1-HC2") or monopolar contacts ("HC1").
# Assignment rule (seeg_wm.channels.assign_regions):
#   1. exact match of the (re-referenced) channel name;
#   2. a bipolar channel "A-B" inherits the region of contact A (then B) if
#      listed monopolarly, and a monopolar contact "A" inherits the region of
#      a listed bipolar pair it belongs to.
# Channels not found are labelled `stats.per_region.unassigned_label`.
# By convention a prime (') in the shaft name denotes the LEFT hemisphere.
#
# The entries below were ported from the emotion-regulation project
# (legacy/Input_file.py) as a starting point – EDIT for the WM cohort.
# =============================================================================

